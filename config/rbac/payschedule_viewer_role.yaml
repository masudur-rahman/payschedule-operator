# permissions for end users to view payschedules.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: payschedule-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: payschedule-operator
    app.kubernetes.io/part-of: payschedule-operator
    app.kubernetes.io/managed-by: kustomize
  name: payschedule-viewer-role
rules:
- apiGroups:
  - pay.mrahman.xyz
  resources:
  - payschedules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pay.mrahman.xyz
  resources:
  - payschedules/status
  verbs:
  - get
